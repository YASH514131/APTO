name: apto
description: Hardware-Secured NFC Tap-to-Pay & Tap-to-Action for Solana Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  nfc_manager: ^3.3.0
  solana_mobile_client: ^0.1.2
  solana: ^0.30.0
  local_auth: ^2.1.8
  video_player: ^2.8.2
  loading_animation_widget: ^1.3.0
  crypto: ^3.0.3
  intl: ^0.18.1
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_secure_storage: ^9.2.2
  lottie: ^3.3.1
  audioplayers: ^6.5.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/vedio/
    - lib/assets/audio/
    - lib/assets/images/
